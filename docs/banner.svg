<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">ownerskit</title>
  <desc id="d">ownerskit: a CODEOWNERS toolkit with a parser, matcher, linter and CLI</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="338" rx="17" fill="none" stroke="#334155" stroke-width="2"/>
  <!-- stylised CODEOWNERS file -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22">
    <rect x="780" y="52" width="372" height="236" rx="12" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <circle cx="806" cy="76" r="6" fill="#475569"/><circle cx="826" cy="76" r="6" fill="#475569"/><circle cx="846" cy="76" r="6" fill="#475569"/>
    <text x="804" y="122" fill="#64748b"># CODEOWNERS</text>
    <text x="804" y="156" fill="#e2e8f0">*</text><text x="860" y="156" fill="#7dd3fc">@acme/platform</text>
    <text x="804" y="190" fill="#e2e8f0">/src/</text><text x="860" y="190" fill="#7dd3fc">@acme/core</text>
    <text x="804" y="224" fill="#e2e8f0">docs/*</text><text x="884" y="224" fill="#7dd3fc">@acme/docs</text>
    <text x="804" y="258" fill="#e2e8f0">*.md</text><text x="860" y="258" fill="#7dd3fc">docs@acme.example</text>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="152" font-size="84" font-weight="700" fill="#f8fafc" letter-spacing="-2">ownerskit</text>
    <text x="74" y="200" font-size="28" fill="#cbd5e1">A faithful CODEOWNERS toolkit for GitHub</text>
    <text x="74" y="238" font-size="22" fill="#94a3b8">Parser, matcher, linter and CLI. TypeScript, ESM, zero dependencies.</text>
    <g font-size="18" font-weight="600">
      <rect x="74" y="266" width="76" height="32" rx="16" fill="#0ea5e9" fill-opacity="0.18" stroke="#38bdf8"/><text x="112" y="288" fill="#7dd3fc" text-anchor="middle">who</text>
      <rect x="162" y="266" width="76" height="32" rx="16" fill="#0ea5e9" fill-opacity="0.18" stroke="#38bdf8"/><text x="200" y="288" fill="#7dd3fc" text-anchor="middle">lint</text>
      <rect x="250" y="266" width="104" height="32" rx="16" fill="#0ea5e9" fill-opacity="0.18" stroke="#38bdf8"/><text x="302" y="288" fill="#7dd3fc" text-anchor="middle">unowned</text>
      <rect x="366" y="266" width="84" height="32" rx="16" fill="#0ea5e9" fill-opacity="0.18" stroke="#38bdf8"/><text x="408" y="288" fill="#7dd3fc" text-anchor="middle">stats</text>
    </g>
  </g>
</svg>
